name: Supabase Keep-Alive

# Supabase pauses free-tier projects after ~7 days without API activity,
# which takes hitchedsa.co.za down (app hangs on "Loading your planner").
# This pings the database every 3 days so it always counts as active.
#
# The anon key below is safe to commit: it is the same public key shipped
# in the client JS bundle to every visitor, and row-level security governs
# what it can access.

on:
  schedule:
    - cron: '0 6 */3 * *' # 06:00 UTC every 3 days
  workflow_dispatch: {} # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          SUPABASE_URL="https://csgybnwdzouhggtatxrr.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzZ3libndkem91aGdndGF0eHJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTI0ODIsImV4cCI6MjA5MjUyODQ4Mn0.Fy2F0o8N6cWmzariPbiHNp3vIxlsU1Lq-eelMWrO7E8"

          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")

          echo "HTTP $STATUS"
          cat /tmp/body

          # 200 = reachable (RLS may return an empty list — that's fine,
          # the request still registers as activity). Anything else fails
          # the job so it shows red in the Actions tab.
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP $STATUS — project may be paused"
            exit 1
          fi
